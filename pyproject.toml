[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-ai-patterns"
version = "0.1.0"
description = "Runnable examples of agent control flow, retrieval, approvals and durable jobs"
requires-python = ">=3.11"
dependencies = ["langgraph>=1.0,<2", "fastapi>=0.115,<1", "httpx>=0.28,<1", "pydantic>=2.10,<3", "jsonschema>=4.23,<5", "mcp>=1.20,<2", "uvicorn>=0.34,<1", "anyio>=4,<5", "langgraph-checkpoint-sqlite>=3.0.1,<4"]

[project.scripts]
agent-patterns = "patterns.application.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.setuptools]
packages = ["patterns", "patterns.workflow", "patterns.routing", "patterns.agents", "patterns.context", "patterns.rag", "patterns.mcp_bridge", "patterns.approval", "patterns.jobs", "patterns.evaluation", "patterns.application"]

[tool.setuptools.package-dir]
"patterns.workflow" = "deterministic-workflow-with-subagents"
"patterns.routing" = "router-and-orchestrator"
"patterns.agents" = "agents-as-tools"
"patterns.context" = "context-management"
"patterns.rag" = "rag-pipeline-with-evals"
"patterns.mcp_bridge" = "mcp-server-from-rest-api"
"patterns.approval" = "human-in-the-loop-approval"
"patterns.jobs" = "event-driven-job-runner"
"patterns.evaluation" = "evaluator-retry-loop"
"patterns.application" = "application"

[tool.pytest.ini_options]
testpaths = ["tests", "deterministic-workflow-with-subagents", "router-and-orchestrator", "agents-as-tools", "context-management", "rag-pipeline-with-evals", "human-in-the-loop-approval", "event-driven-job-runner", "evaluator-retry-loop", "mcp-server-from-rest-api"]
addopts = "-q --import-mode=importlib"

[tool.ruff]
extend-exclude = ["build", "dist"]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
